      // Filter benign origin trial, unrecognized feature, config, and resize notices
      (function() {
        var isBenign = function(msg) {
          if (!msg || typeof msg !== 'string') return false;
          return (

            msg.indexOf('Unrecognized feature') !== -1 ||
            msg.indexOf('No ID or name found in config') !== -1 ||
            msg.indexOf('ResizeObserver loop') !== -1

        var filterMethod = function(orig) {
          return function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isBenign(arguments[i])) return;
            }
            if (orig) orig.apply(console, arguments);
          };
        };

        if (window.console) {
          console.warn = filterMethod(console.warn);
          console.error = filterMethod(console.error);
        }

        window.addEventListener('error', function (e) {
          if (e && isBenign(e.message)) {
            e.stopImmediatePropagation();
            e.stopPropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
