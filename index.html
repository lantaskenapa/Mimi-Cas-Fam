    <script>
      window.addEventListener('error', function (e) {
        if (
          e &&
          e.message &&
          (e.message.indexOf('ResizeObserver loop completed with undelivered notifications') !== -1 ||
            e.message.indexOf('ResizeObserver loop limit exceeded') !== -1)
        ) {
          e.stopImmediatePropagation();
          e.stopPropagation();
          e.preventDefault();
          return true;
        }
      }, true);
    </script>

  <body class="bg-neutral-50 text-neutral-900 antialiased overflow-hidden select-none font-['Plus_Jakarta_Sans',sans-serif]">

  </body>
